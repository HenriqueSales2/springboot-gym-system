<!doctype html>
<html>
<head>
    <title>Gym System API</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@scalar/themes@latest/dist/default.css"/>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        /* Music Button Flutuante Minimalista */
        .music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            color: white;
        }

        .music-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .music-toggle:active {
            transform: scale(0.95);
        }

        .music-toggle.playing::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .music-tooltip {
            position: absolute;
            bottom: 80px;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .music-toggle:hover .music-tooltip {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .music-toggle {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<script
        id="api-reference"
        data-url="/v3/api-docs"
        src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@latest/dist/standalone.js">
</script>

<!-- Botão Flutuante de Música -->
<button class="music-toggle" id="musicToggle" title="Clique para tocar música">
    🎵
    <div class="music-tooltip">Clique para tocar música</div>
</button>

<!-- Elemento de Áudio Oculto -->
<audio id="bgMusic" loop>
    <source src="/music/BackHome.mp3" type="audio/mpeg"/>
    Seu navegador não suporta o elemento de áudio.
</audio>

<script>
    const audioElement = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;

    // Definir volume inicial
    audioElement.volume = 0.5;

    // Event listener para o botão
    musicToggle.addEventListener('click', (e) => {
        e.stopPropagation();

        if (isPlaying) {
            audioElement.pause();
            isPlaying = false;
            musicToggle.classList.remove('playing');
            musicToggle.textContent = '🎵';
        } else {
            audioElement.play().catch(error => {
                console.log('Erro ao reproduzir áudio:', error);
            });
            isPlaying = true;
            musicToggle.classList.add('playing');
            musicToggle.textContent = '🎶';
        }
    });

    // Atualizar estado visual quando o áudio termina ou é pausado
    audioElement.addEventListener('play', () => {
        isPlaying = true;
        musicToggle.classList.add('playing');
        musicToggle.textContent = '🎶';
    });

    audioElement.addEventListener('pause', () => {
        isPlaying = false;
        musicToggle.classList.remove('playing');
        musicToggle.textContent = '🎵';
    });

    // Tentar reproduzir automaticamente ao carregar
    const playOnLoad = () => {
        audioElement.play()
            .then(() => {
                isPlaying = true;
                musicToggle.classList.add('playing');
                musicToggle.textContent = '🎶';
            })
            .catch(() => {
                console.log('Autoplay bloqueado. Clique no botão para reproduzir.');
            });
    };

    // Tentar reproduzir quando o documento estiver pronto
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', playOnLoad);
    } else {
        playOnLoad();
    }

    // Permitir reprodução ao clicar em qualquer lugar (se bloqueado)
    document.addEventListener('click', () => {
        if (!isPlaying && audioElement.paused) {
            audioElement.play().catch(() => {});
        }
    }, { once: true });
</script>
</body>
</html>
