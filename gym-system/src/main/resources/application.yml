cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://example.com.br # preparando a aplicação para no futuro se conectar com React
file: # essa propriedade está sendo gerenciado por mim
  upload-dir: C:/projetos-pessoais/springboot-gym-system/springboot-gym-system/Code/UploadDir # coloque o caminho do seu projeto em seu computador
email:
  subject: "Default Subject"
  message: "Default Message"
spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_with_spring_boot_java?userTimezone=true&serverTimezone=UTC
    username: your_username #username que você usa no banco de dados (padrão: root)
    password: your_password # senha que você criou quando instalou o banco de dados
  jpa:
    hibernate:
      ddl-auto: none # através desse comando o banco de dados sabe que precisa criar a tabela para a aplicação
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.MySQLDialect não há necessidade de especificar esse classe filha do hibernate, pois o Spring já a reconhece por padrão
    show_sql: false # ativar essa funcao somente para debugar
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587 # porta que a google usa
    username: ${EMAIL_USERNAME} # configure sua váriavel de ambiente no computador com o nome "EMAIL_USERNAME" e coloque o seu email do gmail
    password: ${EMAIL_PASSWORD} # configure sua váriavel de ambiente no computador com o nome "EMAIL_PASSWORD" e coloque sua senha gerada na autenticação de 2 fatores do gmail
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
logging:
  level:
    root: INFO # (o comando root dentro desse contexto, serve para eu especificar quais logs eu quero ver dentro da aplicação)
    #net.sf.jasperreports.engine.*: TRACE tive que mudar o nível de log para poder investigar possíveis erros no relatório
    #br.com.application: DEBUG (aqui eu consigo especificar que dentro desse pacote, eu consigo listar quais das quatro logs principais eu quero que apareça (DEBUG, INFO, WARN, ERROR))
springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true