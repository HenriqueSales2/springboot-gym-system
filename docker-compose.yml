services:
   db:
      image: mysql:9.7.1
      restart: always
      environment:
         TZ: America/Sao_Paulo
         MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
         MYSQL_USER: ${MYSQL_USER}
         MYSQL_PASSWORD: ${MYSQL_PASSWORD}
         MYSQL_DATABASE: ${MYSQL_DATABASE}
      ports:
         - "3310:3306"
      expose:
        - 3306
      networks:
         - gym-network   
   gym-system:
      image: henriquesales2/gym-system
      restart: always
      build: ./gym-system
      working_dir: /gym-system
      environment:
         TZ: America/Sao_Paulo
         SPRING.DATASOURCE.URL: ${MYSQL_URL}
         SPRING.DATASOURCE.USERNAME: ${MYSQL_USER}
         SPRING.DATASOURCE.PASSWORD: ${MYSQL_PASSWORD}
      command: mvn spring-boot:run
      ports:
         - 80:80
      depends_on:
         - db
      networks:
         - gym-network
   portainer:
      image: portainer/portainer-ce:latest
      restart: always
      ports:
         - 9000:9000
      volumes:
         -  /var/run/docker.sock:/var/run/docker.sock
         -  portainer_data:/data
      networks:
         - gym-network
volumes:
   portainer_data:
networks:
   gym-network:
      driver: bridge